name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests local_server.py ../scripts
      - run: ruff format --check src tests local_server.py ../scripts
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false
      - name: Build Lambda bundle (validate reads its hash)
        run: ./scripts/build_lambda.sh
      # Failures are re-emitted as annotations so they show up on the run summary.
      - name: Format check
        run: |
          if ! out=$(terraform fmt -check -recursive -diff infra 2>&1); then
            echo "::error title=terraform fmt::${out//$'\n'/%0A}"; exit 1
          fi
      - name: Validate
        run: |
          for dir in infra infra/bootstrap; do
            terraform -chdir=$dir init -backend=false -input=false > /dev/null
            if ! out=$(terraform -chdir=$dir validate -no-color 2>&1); then
              echo "::error title=terraform validate ($dir)::${out//$'\n'/%0A}"; exit 1
            fi
          done
